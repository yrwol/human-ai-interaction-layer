name: HAIL reference implementation

on:
  push:
    branches:
      - feat/hail-native-profile-management
  pull_request:
    branches:
      - main

jobs:
  reference-dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore reference/dotnet/Hail.csproj

      - name: Build
        run: dotnet build reference/dotnet/Hail.csproj --no-restore --configuration Release

      - name: Smoke test profile loading
        run: dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml

      - name: Assert recommend-first Claude contract
        shell: bash
        run: |
          output="$(dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml)"
          echo "$output"
          grep -Fq "give your recommended option first" <<< "$output"

      - name: Generate Claude Code delivery artifact
        run: dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml --output artifacts/claude-code.md

      - name: Validate Claude Code delivery artifact
        shell: bash
        run: |
          test -f artifacts/claude-code.md
          grep -Fq "# HAIL Interaction Instructions" artifacts/claude-code.md
          grep -Fq "give your recommended option first" artifacts/claude-code.md

      - name: Validate safe Claude Code bootstrap
        shell: bash
        run: |
          home="$RUNNER_TEMP/hail-home"
          mkdir -p "$home/.claude"
          printf '# Existing user instructions\nDo not remove me.\n' > "$home/.claude/CLAUDE.md"
          dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml --install claude-code --home "$home"
          dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml --install claude-code --home "$home"
          test -f "$home/.hail/claude-code.md"
          grep -Fq "# HAIL Interaction Instructions" "$home/.hail/claude-code.md"
          grep -Fq "Do not remove me." "$home/.claude/CLAUDE.md"
          test "$(grep -Fc '@~/.hail/claude-code.md' "$home/.claude/CLAUDE.md")" -eq 1

      - name: Generate Codex delivery artifact
        run: dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml --target codex --output artifacts/codex.md

      - name: Validate Codex delivery artifact
        shell: bash
        run: |
          test -f artifacts/codex.md
          grep -Fq "# HAIL Interaction Instructions" artifacts/codex.md
          grep -Fq "recommended option first" artifacts/codex.md

      - name: Validate safe Codex bootstrap
        shell: bash
        run: |
          home="$RUNNER_TEMP/hail-codex-home"
          mkdir -p "$home/.codex"
          printf '# Existing Codex instructions\nDo not remove me.\n' > "$home/.codex/AGENTS.md"
          dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml --install codex --home "$home"
          dotnet run --project reference/dotnet --configuration Release --no-build -- profiles/example.yaml --install codex --home "$home"
          grep -Fq "Do not remove me." "$home/.codex/AGENTS.md"
          grep -Fq '<!-- HAIL:START -->' "$home/.codex/AGENTS.md"
          grep -Fq "# HAIL Interaction Instructions" "$home/.codex/AGENTS.md"
          test "$(grep -Fc '<!-- HAIL:START -->' "$home/.codex/AGENTS.md")" -eq 1
          test "$(grep -Fc '<!-- HAIL:END -->' "$home/.codex/AGENTS.md")" -eq 1

  native-claude-shape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Claude plugin shape
        shell: bash
        run: |
          test -f integrations/claude/.claude-plugin/plugin.json
          test -f integrations/claude/skills/hail/SKILL.md
          grep -Fq '"name": "hail"' integrations/claude/.claude-plugin/plugin.json
          grep -Fq 'name: hail' integrations/claude/skills/hail/SKILL.md
          grep -Fq '~/.hail/profile.yaml' integrations/claude/skills/hail/SKILL.md
          grep -Fq '<!-- HAIL:START -->' integrations/claude/skills/hail/SKILL.md
